<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Owner Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Moto Servis</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/owners">Owners</a>
      <a class="nav-link" href="/motorcycles">Motorcycles</a>
      <a class="nav-link" href="/mechanics">Mechanics</a>
      <a class="nav-link" href="/service-records">Service Records</a>
      <a class="nav-link" href="/parts">Parts</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 th:text="${owner.id == null} ? 'New Owner' : 'Edit Owner'"></h2>

      <form th:action="${owner.id == null} ? @{/owners} : @{/owners/{id}(id=${owner.id})}"
            th:object="${owner}" method="post">

        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" th:field="*{firstName}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" th:field="*{lastName}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" th:field="*{phone}">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" th:field="*{email}">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-dark">Save</button>
          <a href="/owners" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>

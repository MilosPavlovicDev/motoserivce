<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Owners</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Moto Servis</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/owners">Owners</a>
      <a class="nav-link" href="/motorcycles">Motorcycles</a>
      <a class="nav-link" href="/mechanics">Mechanics</a>
      <a class="nav-link" href="/service-records">Service Records</a>
      <a class="nav-link" href="/parts">Parts</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Owners</h2>
    <a href="/owners/new" class="btn btn-dark">+ New Owner</a>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="owner : ${owners}">
      <td th:text="${owner.id}"></td>
      <td th:text="${owner.firstName}"></td>
      <td th:text="${owner.lastName}"></td>
      <td th:text="${owner.phone}"></td>
      <td th:text="${owner.email}"></td>
      <td>
        <a th:href="@{/owners/{id}/edit(id=${owner.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <a th:href="@{/owners/{id}/delete(id=${owner.id})}" class="btn btn-sm btn-outline-danger"
           onclick="return confirm('Are you sure?')">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>

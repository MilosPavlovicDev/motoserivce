<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Moto Service</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/owners">Owners</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/mechanics">Mechanics</a>
            <a class="nav-link" href="/service-records">Service Records</a>
            <a class="nav-link" href="/parts">Parts</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Service Records</h2>
        <a href="/service-records/new" class="btn btn-dark">+ New Service Record</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Motorcycle</th>
            <th>Mechanic</th>
            <th>Date</th>
            <th>Problem</th>
            <th>Labor Cost</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sr : ${serviceRecords}">
            <td th:text="${sr.id}"></td>
            <td th:text="${sr.motorcycle.brand + ' ' + sr.motorcycle.model}"></td>
            <td th:text="${sr.mechanic.firstName + ' ' + sr.mechanic.lastName}"></td>
            <td th:text="${sr.date}"></td>
            <td th:text="${sr.problemDescription}"></td>
            <td th:text="${sr.laborCost}"></td>
            <td>
                    <span th:text="${sr.status}"
                          th:classappend="${sr.status.name() == 'COMPLETED'} ? 'badge bg-success' :
                                          (${sr.status.name() == 'IN_PROGRESS'} ? 'badge bg-warning text-dark' :
                                          'badge bg-secondary')">
                    </span>
            </td>
            <td>
                <a th:href="@{/service-records/{id}/edit(id=${sr.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <a th:href="@{/service-records/{id}/delete(id=${sr.id})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

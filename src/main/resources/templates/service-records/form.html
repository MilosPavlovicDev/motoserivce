<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Record Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Moto Servis</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/owners">Owners</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/mechanics">Mechanics</a>
            <a class="nav-link" href="/service-records">Service Records</a>
            <a class="nav-link" href="/parts">Parts</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:text="${serviceRecord.id == null} ? 'New Service Record' : 'Edit Service Record'"></h2>

            <form th:action="${serviceRecord.id == null} ? @{/service-records} : @{/service-records/{id}(id=${serviceRecord.id})}"
                  th:object="${serviceRecord}" method="post">

                <div class="mb-3">
                    <label class="form-label">Motorcycle</label>
                    <select class="form-select" name="motorcycleId" required>
                        <option value="">-- Select Motorcycle --</option>
                        <option th:each="m : ${motorcycles}"
                                th:value="${m.id}"
                                th:text="${m.brand + ' ' + m.model + ' (' + m.licencePlate + ')'}"
                                th:selected="${serviceRecord.motorcycle != null && serviceRecord.motorcycle.id == m.id}">
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mechanic</label>
                    <select class="form-select" name="mechanicId" required>
                        <option value="">-- Select Mechanic --</option>
                        <option th:each="mech : ${mechanics}"
                                th:value="${mech.id}"
                                th:text="${mech.firstName + ' ' + mech.lastName}"
                                th:selected="${serviceRecord.mechanic != null && serviceRecord.mechanic.id == mech.id}">
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" th:field="*{date}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Problem Description</label>
                    <textarea class="form-control" th:field="*{problemDescription}" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Labor Cost (RSD)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{laborCost}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Save</button>
                    <a href="/service-records" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

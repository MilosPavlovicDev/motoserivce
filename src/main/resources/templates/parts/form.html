<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Moto Servis</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/owners">Owners</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/mechanics">Mechanics</a>
            <a class="nav-link" href="/service-records">Service Records</a>
            <a class="nav-link" href="/parts">Parts</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:text="${part.id == null} ? 'New Part' : 'Edit Part'"></h2>

            <form th:action="${part.id == null} ? @{/parts} : @{/parts/{id}(id=${part.id})}"
                  th:object="${part}" method="post">

                <div class="mb-3">
                    <label class="form-label">Part Name</label>
                    <input type="text" class="form-control" th:field="*{name}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price (RSD)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{price}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Service Record</label>
                    <select class="form-select" name="serviceRecordId" required>
                        <option value="">-- Select Service Record --</option>
                        <option th:each="sr : ${serviceRecords}"
                                th:value="${sr.id}"
                                th:text="${sr.motorcycle.brand + ' ' + sr.motorcycle.model + ' - ' + sr.date}"
                                th:selected="${part.serviceRecord != null && part.serviceRecord.id == sr.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Save</button>
                    <a href="/parts" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

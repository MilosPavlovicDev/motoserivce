<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Motorcycles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Moto Service</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/owners">Owners</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/mechanics">Mechanics</a>
            <a class="nav-link" href="/service-records">Service Records</a>
            <a class="nav-link" href="/parts">Parts</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Motorcycles</h2>
        <a href="/motorcycles/new" class="btn btn-dark">+ New Motorcycle</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Year</th>
            <th>License Plate</th>
            <th>Owner</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="motorcycle : ${motorcycles}">
            <td th:text="${motorcycle.id}"></td>
            <td th:text="${motorcycle.brand}"></td>
            <td th:text="${motorcycle.model}"></td>
            <td th:text="${motorcycle.yearOfManufacture}"></td>
            <td th:text="${motorcycle.licencePlate}"></td>
            <td th:text="${motorcycle.owner.firstName + ' ' + motorcycle.owner.lastName}"></td>
            <td>
                <a th:href="@{/motorcycles/{id}/edit(id=${motorcycle.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <a th:href="@{/motorcycles/{id}/delete(id=${motorcycle.id})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

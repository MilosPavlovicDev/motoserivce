<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Motorcycle Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Moto Servis</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/owners">Owners</a>
            <a class="nav-link" href="/motorcycles">Motorcycles</a>
            <a class="nav-link" href="/mechanics">Mechanics</a>
            <a class="nav-link" href="/service-records">Service Records</a>
            <a class="nav-link" href="/parts">Parts</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 th:text="${motorcycle.id == null} ? 'New Motorcycle' : 'Edit Motorcycle'"></h2>

            <form th:action="${motorcycle.id == null} ? @{/motorcycles} : @{/motorcycles/{id}(id=${motorcycle.id})}"
                  th:object="${motorcycle}" method="post">

                <div class="mb-3">
                    <label class="form-label">Brand</label>
                    <input type="text" class="form-control" th:field="*{brand}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Model</label>
                    <input type="text" class="form-control" th:field="*{model}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Year of Manufacture</label>
                    <input type="number" class="form-control" th:field="*{yearOfManufacture}">
                </div>
                <div class="mb-3">
                    <label class="form-label">License Plate</label>
                    <input type="text" class="form-control" th:field="*{licencePlate}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Owner</label>
                    <select class="form-select" name="ownerId" required>
                        <option value="">-- Select Owner --</option>
                        <option th:each="owner : ${owners}"
                                th:value="${owner.id}"
                                th:text="${owner.firstName + ' ' + owner.lastName}"
                                th:selected="${motorcycle.owner != null && motorcycle.owner.id == owner.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark">Save</button>
                    <a href="/motorcycles" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
